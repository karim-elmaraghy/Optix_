[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunix-local"
version = "0.1.0"
description = "Tunix: a local AI GPU inference optimization agent"
requires-python = ">=3.10"
dependencies = ["gradio==6.31.0"]

[project.optional-dependencies]
gpu = ["torch", "transformers", "datasets", "nvidia-ml-py"]
test = ["pytest"]

[project.scripts]
tunix = "tunix.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["tunix*"]
